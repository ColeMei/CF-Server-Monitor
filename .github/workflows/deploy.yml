name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-server-monitor-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Test agent configuration
        run: npm run test:agent-config

      - name: Validate deployment secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          test -n "$D1_DATABASE_ID"
          test -n "$API_SECRET"

      - name: Create deployment configuration
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "server-monitor-pro"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]
          WEOF

          sed -i "s|D1_PLACEHOLDER|$D1_DATABASE_ID|g" wrangler.toml

      - name: Prepare Worker secrets
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          jq -n --arg api_secret "$API_SECRET" \
            '{API_SECRET: $api_secret}' > "$RUNNER_TEMP/worker-secrets.json"
          chmod 600 "$RUNNER_TEMP/worker-secrets.json"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
